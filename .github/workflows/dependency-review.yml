# PR gate: block newly introduced runtime vulns and FINOS Category-X licenses
# in dependency diffs (npm / GitHub dependency graph).
# Requires: Settings → Code security → Dependency graph (enabled).
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          # Match project preference: ignore pure-dev dependency noise
          fail-on-scopes: runtime
          # FINOS Category X (subset of SPDX ids commonly seen on npm/PyPI)
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            LGPL-2.0-only,
            LGPL-2.0-or-later,
            LGPL-2.1-only,
            LGPL-2.1-or-later,
            LGPL-3.0-only,
            LGPL-3.0-or-later,
            SSPL-1.0,
            BUSL-1.1
          comment-summary-in-pr: on-failure
