# PR gate: block newly introduced runtime vulns and non-allowed licenses
# in dependency diffs (npm / GitHub dependency graph).
# Requires: Settings → Code security → Dependency graph (enabled).

name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          # FINOS Category A (+ common SPDX spellings) and Category B (MPL/EPL/CDDL/OFL).
          # Mutually exclusive with deny-licenses.
          allow-licenses: >-
            0BSD,
            Apache-2.0,
            BlueOak-1.0.0,
            BSD-2-Clause,
            BSD-3-Clause,
            BSD-3-Clause-Clear,
            CC0-1.0,
            CDDL-1.0,
            CDDL-1.1,
            EPL-1.0,
            EPL-2.0,
            ISC,
            MIT,
            MIT-0,
            MPL-1.1,
            MPL-2.0,
            OFL-1.1,
            Python-2.0,
            Unlicense,
            WTFPL,
            Zlib
          # Known transitive exceptions reviewed separately.
          allow-dependencies-licenses: pkg:npm/caniuse-lite
          comment-summary-in-pr: on-failure
